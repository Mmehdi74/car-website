# SQUADRO — Base44 sandbox environment.
# Runs the Vite dev server straight from the bind-mounted source so edits appear live.
services:
  web:
    image: node:22
    working_dir: /app
    restart: on-failure
    init: true
    ports:
      - '3000:5173'
    volumes:
      - ./:/app
    environment:
      # Consumed by vite.config.ts to extend allowedHosts inside the sandbox only.
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
      - CHOKIDAR_USEPOLLING=true
    command:
      [
        'sh',
        '-ec',
        'npm install --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 5173',
      ]
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:5173/ >/dev/null || exit 1']
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 120s
    labels:
      base44.project: SQUADRO
      base44.kind: web
      base44.port: '3000'
