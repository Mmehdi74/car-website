services:
  web:
    image: node:22-bookworm-slim
    working_dir: /app
    labels:
      base44.project: AUTOCAR Website
      base44.kind: web
      base44.port: "3000"
    ports:
      - "3000:5173"
    environment:
      - NODE_ENV=development
      - BASE44_PREVIEW_MODE
      # Vite >= 6.1 appends this to server.allowedHosts, so the sandbox preview
      # proxy host is accepted without hardcoding an environment-specific value.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_SANDBOX_HOST_DOMAIN
      - BASE44_PUBLIC_HOST_SUFFIX
      - VITE_API_TARGET=http://api:4000
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npx vite --host 0.0.0.0 --port 5173"]
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    restart: on-failure

  api:
    image: node:22-bookworm-slim
    working_dir: /app
    labels:
      base44.project: AUTOCAR API
      base44.kind: api
      base44.port: "4000"
      base44.docs: /api/health
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - BASE44_PREVIEW_MODE
      - PORT=4000
      - DATABASE_FILE=/data/inquiries.db
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec node --watch src/server.js"]
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules
      - api_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    restart: on-failure

volumes:
  web_node_modules:
  api_node_modules:
  api_data:
